name: Python Lint with Full Reports

on:
  push:
    branches: [ dev ]
  pull_request:

jobs:
  lint:
    name: Python Linters + Log Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linting Tools
        run: |
          pip install ruff black mypy

      - name: Run Ruff (save log)
        run: |
          ruff check . > ruff_report.txt 2>&1 || true

      - name: Run Black (save log)
        run: |
          black --check . > black_report.txt 2>&1 || true

      - name: Run Mypy (save log)
        run: |
          mypy . > mypy_report.txt 2>&1 || true

      - name: Combine all reports
        run: |
          echo "=== Ruff Report ===" > lint-report.txt
          cat ruff_report.txt >> lint-report.txt
          echo -e "\n\n=== Black Report ===" >> lint-report.txt
          cat black_report.txt >> lint-report.txt
          echo -e "\n\n=== Mypy Report ===" >> lint-report.txt
          cat mypy_report.txt >> lint-report.txt

      - name: Upload all individual reports
        uses: actions/upload-artifact@v4
        with:
          name: python-lint-reports
          path: |
            ruff_report.txt
            black_report.txt
            mypy_report.txt
            lint-report.txt
