name: Lint → SonarQube → Email → Trivy

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  lint:
    name: Lint Code with Super-Linter
    runs-on: ubuntu-latest
    outputs:
      lint_status: ${{ steps.lint.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        id: lint
        uses: github/super-linter/slim@v6
        continue-on-error: true
        env:
          DEFAULT_BRANCH: dev
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_PYTHON: true

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK (required for SonarScanner)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarQube Scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  notify-sonar-result:
    name: Email Result of SonarQube Scan
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Send Email if SonarQube Passed
        if: ${{ needs.sonarqube.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ✅ SonarQube Scan Passed on ${{ github.ref_name }}
          to: luvis@sirpi.io
          from: GitHub CI <noreply@example.com>
          body: |
            Hello Developer,

            ✅ The SonarQube scan **passed** for branch `${{ github.ref_name }}`.

            Check the run details here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Thanks,
            GitHub CI

      - name: Send Email if SonarQube Failed
        if: ${{ needs.sonarqube.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.example.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ❌ SonarQube Scan Failed on ${{ github.ref_name }}
          to: developer@example.com
          from: GitHub CI <noreply@example.com>
          body: |
            Hello Developer,

            ❌ The SonarQube scan **failed** for branch `${{ github.ref_name }}`.

            Please investigate the issue:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Thanks,
            GitHub CI

  trivy:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: notify-sonar-result
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t demo-trivy-app .

      - name: Create reports directory
        run: mkdir -p trivy-reports

      - name: Trivy FS Scan (source code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          output: trivy-reports/fs-report.txt

      - name: Trivy Image Scan (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: demo-trivy-app
          format: table
          severity: CRITICAL,HIGH
          output: trivy-reports/image-report.txt

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/
