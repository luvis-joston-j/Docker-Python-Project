name: Super Linter

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  lint:
    name: Lint Code with Super-Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: github/super-linter/slim@v6
        continue-on-error: true
        env:
          DEFAULT_BRANCH: dev
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_PYTHON: true

      - name: Create Lint Log Info
        if: always()
        run: |
          mkdir -p logs
          echo "🔗 Download full Super-Linter output logs here:" > logs/README.txt
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> logs/README.txt

      - name: Upload Lint Info as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-log-info
          path: logs/
