name: Lint → SonarQube → Email → Trivy

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  lint:
    name: Lint Code with Super-Linter
    runs-on: ubuntu-latest
    outputs:
      lint_status: ${{ steps.linter.outcome }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Super-Linter Image
        run: docker pull ghcr.io/github/super-linter:slim-latest

      - name: Run Super-Linter and Save Report
        id: linter
        run: |
          mkdir -p lint-reports
          docker run \
            -e RUN_LOCAL=true \
            -e DEFAULT_BRANCH=dev \
            -e VALIDATE_ALL_CODEBASE=true \
            -e VALIDATE_PYTHON=true \
            -v ${{ github.workspace }}:/tmp/lint \
            ghcr.io/github/super-linter:slim-latest \
            | tee lint-reports/lint-report.txt

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: lint-reports/

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK (required for SonarScanner)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarQube Scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  notify-sonar-result:
    name: Email Result of SonarQube Scan
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Send Email if SonarQube Passed
        if: ${{ needs.sonarqube.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ✅ SonarQube Scan Passed on ${{ github.ref_name }}
          to: luvis@sirpi.io
          from: GitHub CI <noreply@example.com>
          body: |
            Hello Developer,

            ✅ The SonarQube scan **passed** for branch `${{ github.ref_name }}`.

            Check the run details here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Thanks,
            GitHub CI

      - name: Send Email if SonarQube Failed
        if: ${{ needs.sonarqube.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ❌ SonarQube Scan Failed on ${{ github.ref_name }}
          to: developer@example.com
          from: GitHub CI <noreply@example.com>
          body: |
            Hello Developer,

            ❌ The SonarQube scan **failed** for branch `${{ github.ref_name }}`.

            Please investigate the issue:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Thanks,
            GitHub CI

  notify-lint-result:
    name: Email Lint Report
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Download Lint Report
        uses: actions/download-artifact@v4
        with:
          name: lint-reports
          path: lint-reports

      - name: Send Lint Report Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: 🧹 Lint Report for ${{ github.ref_name }}
          to: luvis@sirpi.io
          from: GitHub CI <noreply@example.com>
          body: |
            Hello Developer,

            Attached is the Super-Linter report for `${{ github.ref_name }}`.

            ✅ Run details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Thanks,
            GitHub CI
          attachments: lint-reports/lint-report.txt

  trivy:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: [notify-sonar-result, notify-lint-result]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t demo-trivy-app .

      - name: Create reports directory
        run: mkdir -p trivy-reports

      - name: Trivy FS Scan (source code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          output: trivy-reports/fs-report.txt

      - name: Trivy Image Scan (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: demo-trivy-app
          format: table
          severity: CRITICAL,HIGH
          output: trivy-reports/image-report.txt

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/
