name: Lint → SonarQube → Email → Trivy

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  lint:
    name: Lint Code with Super-Linter
    runs-on: ubuntu-latest
    outputs:
      log_path: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Super-Linter
        uses: github/super-linter/slim@v6
        env:
          DEFAULT_BRANCH: dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_PYTHON: true
        continue-on-error: true

      - name: Save Linter Log
        run: |
          mkdir -p lint-logs
          cp /tmp/lint-results.log lint-logs/super-linter.log || echo "Log not found"

      - name: Upload Linter Logs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: super-linter-report
          path: lint-logs/super-linter.log

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK (required for SonarScanner)
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Wait for Quality Gate result
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanTimeout: '300'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Download SonarQube Issues Report
        run: |
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
            "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=Python&types=BUG,VULNERABILITY,CODE_SMELL" \
            -o sonar_issues.json
          jq -r '
            ["Key","Severity","Type","Component","Message"],
            (.issues[] | [.key, .severity, .type, .component, .message])
            | @csv
          ' sonar_issues.json > sonar_issues.csv

      - name: Upload SonarQube Report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-quality-report
          path: |
            sonar_issues.json
            sonar_issues.csv

  notify-sonar-result:
    name: Email Result of SonarQube Scan
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: email-artifacts

      - name: Send Email if Passed
        if: ${{ needs.sonarqube.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ✅ SonarQube Passed on ${{ github.ref_name }}
          to: luvis@sirpi.io
          from: GitHub CI <noreply@example.com>
          body: |
            ✅ SonarQube passed on `${{ github.ref_name }}`
            Reports attached.
          attachments: |
            email-artifacts/super-linter-report/super-linter.log
            email-artifacts/sonar-quality-report/sonar_issues.csv

      - name: Send Email if Failed
        if: ${{ needs.sonarqube.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: ❌ SonarQube Failed on ${{ github.ref_name }}
          to: developer@example.com
          from: GitHub CI <noreply@example.com>
          body: |
            ❌ SonarQube failed on `${{ github.ref_name }}`
            Reports attached.
          attachments: |
            email-artifacts/super-linter-report/super-linter.log
            email-artifacts/sonar-quality-report/sonar_issues.csv

  trivy:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: notify-sonar-result
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t demo-trivy-app .

      - name: Create reports directory
        run: mkdir -p trivy-reports

      - name: Trivy FS Scan (source code)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          output: trivy-reports/fs-report.txt

      - name: Trivy Image Scan (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: demo-trivy-app
          format: table
          severity: CRITICAL,HIGH
          output: trivy-reports/image-report.txt

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-reports/
